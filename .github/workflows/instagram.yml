# 6時間ごとに Instagram の最新投稿を取得して、instagram.json と画像をコミットする
name: Update Instagram posts

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch posts
        run: node scripts/fetch-instagram.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}

      - name: Commit changes
        run: |
          if [ ! -f instagram.json ]; then
            echo "保存する投稿がないため、コミットしません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram.json instagram
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Update Instagram posts"
            git push
          fi
