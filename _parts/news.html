<!-- title: NEWS -->
<main>
  <section class="page-head">
    <div class="wrap">
      <p class="crumb"><a href="index.html">Top</a> / News</p>
      <p class="eyebrow">News</p>
      <h1>お知らせ</h1>
      <p class="lead">試合結果、選手の加入、イベントなど、チームの最新情報をお届けします。</p>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <div class="filters" role="group" aria-label="カテゴリで絞り込む">
        <button type="button" data-filter="all" aria-pressed="true">すべて</button>
        <button type="button" data-filter="match" aria-pressed="false">試合</button>
        <button type="button" data-filter="club" aria-pressed="false">クラブ</button>
        <button type="button" data-filter="partner" aria-pressed="false">スポンサー</button>
      </div>
      <ul class="news" id="news-list">
        <li data-cat="club"><a href="index.html"><time datetime="2026-10-13">2026.10.13</time><span class="cat club">クラブ</span><span class="news-title">公式ホームページを公開しました</span></a></li>
        <li data-cat="partner"><a href="sponsor.html"><time datetime="2026-10-13">2026.10.13</time><span class="cat partner">スポンサー</span><span class="news-title">スポンサーの募集を開始しました</span></a></li>
        <li data-cat="match"><a href="match.html"><time datetime="2026-10-12">2026.10.12</time><span class="cat match">試合</span><span class="news-title">10/24（土）第9節 South Tokyo FCとの首位決戦のお知らせ</span></a></li>
        <li data-cat="match"><a href="gallery-2026-10-10.html"><time datetime="2026-10-10">2026.10.10</time><span class="cat match">試合</span><span class="news-title">第5節 宮前スカーヴァティー戦 9-2で勝利、開幕8連勝</span></a></li>
        <li data-cat="match"><a href="gallery-2026-09-26.html"><time datetime="2026-09-26">2026.09.26</time><span class="cat match">試合</span><span class="news-title">第8節 FC金沢戦 13-0で勝利</span></a></li>
        <li data-cat="match"><a href="gallery-2026-08-22.html"><time datetime="2026-08-22">2026.08.22</time><span class="cat match">試合</span><span class="news-title">第7節 FC.全力de蹴球戦 4-0で勝利</span></a></li>
      </ul>
    </div>
  </section>
</main>
<script>
  (function () {
    var buttons = document.querySelectorAll('[data-filter]');
    var items = document.querySelectorAll('#news-list li');
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var f = btn.getAttribute('data-filter');
        buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b === btn)); });
        items.forEach(function (li) { li.hidden = !(f === 'all' || li.getAttribute('data-cat') === f); });
      });
    });
  })();
</script>
